<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистика бота</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
    }
    h1 { margin-bottom: 30px; font-size: 28px; }
    .cards {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 40px;
    }
    .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px 32px;
        text-align: center;
        min-width: 160px;
    }
    .num {
        font-size: 42px;
        font-weight: 700;
        color: #38bdf8;
    }
    .label { color: #94a3b8; margin-top: 4px; }
    .top {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px 32px;
        width: 100%;
        max-width: 400px;
    }
    .top h2 { margin-bottom: 16px; font-size: 20px; }
    .top li {
        list-style: none;
        padding: 8px 0;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
    }
    .top li:last-child { border-bottom: none; }
    .count { color: #38bdf8; font-weight: 600; }
    .error { color: #f87171; margin-top: 20px; }
</style>
</head>
<body>

<h1>📊 Статистика бота</h1>

<div class="cards">
    <div class="card">
        <div class="num" id="users">–</div>
        <div class="label">Пользователей</div>
    </div>
    <div class="card">
        <div class="num" id="messages">–</div>
        <div class="label">Сообщений</div>
    </div>
    <div class="card">
        <div class="num" id="today">–</div>
        <div class="label">Сегодня</div>
    </div>
</div>

<div class="top">
    <h2>🏆 Топ активных</h2>
    <ul id="topList"></ul>
</div>

<div class="error" id="error"></div>

<script>
fetch('http://localhost:8000/stats')
    .then(response => response.json())
    .then(data => {
        document.getElementById('users').textContent = data.total_users;
        document.getElementById('messages').textContent = data.total_messages;
        document.getElementById('today').textContent = data.today_messages;

        const list = document.getElementById('topList');
        data.top_users.forEach(([username, count], i) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${i + 1}. @${username}</span><span class="count">${count} сообщ.</span>`;
            list.appendChild(li);
        });
    })
    .catch(err => {
        document.getElementById('error').textContent =
            'Не удалось подключиться к API. Сервер запущен? (uvicorn api:app)';
    });
</script>

</body>
</html>
